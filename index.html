<!DOCTYPE html>
<html>
<head>
<title>Site Animado</title>

<style>
body {
    margin: 0;
    height: 100vh;
    background: #111;
    overflow: hidden;
}

.circulo {
    width: 100px;
    height: 100px;
    background: #00ffcc;
    border-radius: 50%;
    position: absolute;
    animation: mover 4s infinite alternate;
}

@keyframes mover {
    0% {
        left: 0;
        top: 0;
    }

    50% {
        left: 70%;
        top: 40%;
        background: #ff0066;
    }

    100% {
        left: 80%;
        top: 80%;
        background: #ffff00;
    }
}
</style>

</head>

<body>

<div class="circulo"></div>

</body>
</html>
